apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Chart.Name }}
    component: app
  ports:
  - port: {{ .Values.app.ports.internal }}
    targetPort: {{ .Values.app.ports.internal }}

---

apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: {{ .Chart.Name }}
  name: {{ .Chart.Name }}-config
  namespace: {{ .Values.namespace }}
data:
  FT_ALLOWED_HOSTS: {{ .Chart.Name }},localhost
  FT_CSRF_TRUSTED_ORIGINS: {{ if .Values.ingress.active }}https://{{ .Values.ingress.fqdn }},{{ end }}http://localhost:{{ .Values.proxy.ports.internal }}
  FT_DB_ENGINE: {{ .Values.app.database.engine }}
  FT_DB_PORT: {{ quote .Values.app.database.port}}
  FT_DEBUG: {{ quote .Values.app.debug }}

---

{{ if .Values.useSealedSecrets -}}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  labels:
    app: {{ .Chart.Name }}
  name: {{ .Chart.Name }}-secrets
  namespace: {{ .Values.namespace }}
spec:
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    type: Opaque
  encryptedData:
    FT_DB_HOST: {{ .Values.app.database.host }}
    FT_DB_NAME: {{ .Values.app.database.name }}
    {{ with .Values.app.database.password }}FT_DB_PASSWORD: .{{ end }}
    FT_DB_USERNAME: {{ .Values.app.database.username }}
    {{ with .Values.app.database.sslmode }}FT_DB_SSLMODE: .{{ end }}
    {{ with .Values.app.database.mtls.keyPassword }}FT_DB_SSLPASSWORD: .{{ end }}
    {{ with .Values.app.database.options }}FT_DB_OPTIONS: .{{ end }}
    FT_SECRET_KEY: {{ .Values.app.secretKey }}
apiVersion: v1
kind: Secret
metadata:
  labels:
    app: {{ .Chart.Name }}
  name: {{ .Chart.Name }}-secrets
  namespace: {{ .Values.namespace }}
data:
  FT_DB_HOST: {{ b64enc .Values.app.database.host }}
  FT_DB_NAME: {{ b64enc .Values.app.database.name }}
  {{ with .Values.app.database.password }}FT_DB_PASSWORD: {{ b64enc . }}{{ end }}
  FT_DB_USERNAME: {{ b64enc .Values.app.database.username }}
  {{ with .Values.app.database.sslmode }}FT_DB_SSLMODE: {{ b64enc . }}{{ end }}
  {{ with .Values.app.database.mtls.keyPassword }}FT_DB_SSLPASSWORD: {{ b64enc . }}{{ end }}
  {{ with .Values.app.database.options }}FT_DB_OPTIONS: {{ b64enc . }}{{ end }}
  FT_SECRET_KEY: {{ b64enc .Values.app.secretKey }}
type: Opaque
{{- end }}

---

{{ $dbMTLS := and .Values.app.database.mtls.cert .Values.app.database.mtls.key -}}
{{ if $dbMTLS -}}
{{ if .Values.useSealedSecrets -}}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    {{- with .Values.sealedSecretsScope }}
    sealedsecrets.bitnami.com/{{ . }}: "true"
    {{- end }}
  labels:
    app: {{ .Chart.Name }}
  name: {{ .Chart.Name }}-db-mtls-certs
  namespace: {{ .Values.namespace }}
spec:
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    type: kubernetes.io/tls
  encryptedData:
    tls.crt: {{ .Values.app.database.mtls.cert }}
    tls.key: {{ .Values.app.database.mtls.key }}
    {{ with .Values.app.database.mtls.caCert }}ca.crt: {{ . }}{{ end }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  labels:
    app: {{ .Chart.Name }}
  name: {{ .Chart.Name }}-db-mtls-certs
  namespace: {{ .Values.namespace }}
type: kubernetes.io/tls
data:
  tls.crt: {{ b64enc .Values.app.database.mtls.cert }}
  tls.key: {{ b64enc .Values.app.database.mtls.key }}
  {{ with .Values.app.database.mtls.caCert }}ca.crt: {{ b64enc . }}{{ end }}
{{- end }}
{{- end }}

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      component: app
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        component: app
        technology: python
    spec:
      initContainers:
      - name: init-migrate
        image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag | default .Chart.AppVersion }}"
        command: ['python3', 'manage.py', 'migrate']
        {{- with .Values.app.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        envFrom:
        - configMapRef:
            name: {{ .Chart.Name }}-config
        - secretRef:
            name: {{ .Chart.Name }}-secrets
        {{- if $dbMTLS }}
        env:
        - name: FT_DB_SSLCERT
          value: /home/app/mtls/tls.crt
        - name: FT_DB_SSLKEY
          value: /home/app/mtls/tls.key
        - name: FT_DB_SSLROOTCERT
          value: /home/app/mtls/ca.crt
        volumeMounts:
        - name: {{ .Chart.Name }}-db-mtls-certs
          mountPath: /home/app/mtls/
          readOnly: true
        {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag | default .Chart.AppVersion }}"
        ports:
        - containerPort: {{ .Values.app.ports.internal }}
        {{- if .Values.app.probes.liveness.active }}
        livenessProbe:
          httpGet:
            path: {{ .Values.app.probes.liveness.path }}
            port: {{ .Values.app.ports.internal }}
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 30
        {{- end }}
        {{- with .Values.app.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        envFrom:
        - configMapRef:
            name: {{ .Chart.Name }}-config
        - secretRef:
            name: {{ .Chart.Name }}-secrets
        {{- if $dbMTLS }}
        env:
        - name: FT_DB_SSLCERT
          value: /home/app/mtls/tls.crt
        - name: FT_DB_SSLKEY
          value: /home/app/mtls/tls.key
        - name: FT_DB_SSLROOTCERT
          value: /home/app/mtls/ca.crt
        volumeMounts:
        - name: {{ .Chart.Name }}-db-mtls-certs
          mountPath: /home/app/mtls/
          readOnly: true
        {{- end }}
      serviceAccountName: {{ .Chart.Name }}
      terminationGracePeriodSeconds: {{ .Values.app.terminationGracePeriodSeconds }}
      {{- if $dbMTLS }}
      volumes:
      - name: db-mtls-certs
        secret:
          secretName: {{ .Chart.Name }}-db-mtls-certs
          defaultMode: 0400
      {{- end }}

